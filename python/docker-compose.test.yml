version: '3.8'

services:
  mongodb-test:
    image: mongo:7.0
    container_name: vindinium-test-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vindinium_test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    tmpfs:
      - /data/db
    command: --quiet
